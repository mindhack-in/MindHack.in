<!DOCTYPE html>
<html lang="en">


<head>
  <title>3X3 Rubik's cube timer @ MindHack.in</title>
  <link rel="canonical" href="https://mindhack.in/games/rubiks-cube-scramble/3X3/" />
  <meta name="description" content="3x3 Rubiks cube scramble, checkout our scrambles to boost your cubing speed." />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../squaretimer.css">
  <link rel="stylesheet" href="../home.css">

  <script>
    window.pageConfig = {
      size: "3"
    };
  </script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <script type="module" src="../../../utility/js/base.js"></script>
  <link rel="stylesheet" href="../../../utility/main.css">
</head>

<body>
  <div id="head-left"></div>

  <div class="content ">

    <div class="timer-click" onclick="startStopTimer()">
      <div id="timer" class="timer-display">00.00</div>
      <div class="timer-buttons">
        <button onclick="stopTimer()" class="start">Start</button>
        <button onclick="startTimer()" class="stop">Stop</button>

      </div>
      <div class="options">
        <label class="hide">Inspection
          <select id="inspection">
            <option value="0">0 s</option>
          </select>
        </label>
        <label><input type="checkbox" id="showScramble" checked> Show scramble</label>
        <label><input type="checkbox" id="hideTime"> Hide time</label>
      </div>

      <div id="scrambleSection" class="scramble-section">
        <div class="scramble-header">
          <p><strong id="scrambleType">Scramble (2x2):</strong></p>
          <p id="scramble" class="scramble"></p>
          <button onclick="generateScramble()" class="generate">Generate New Scramble</button>
        </div>
        <div class="scene">
          <button class="cube-btn">
            <div class="cube-face front"> </div>
            <div class="cube-face back"> </div>
            <div class="cube-face left"> </div>
            <div class="cube-face right"> </div>
            <div class="cube-face top"> </div>
            <div class="cube-face bottom"> </div>
          </button>
        </div>
      </div>

      <div class="averages">
        <p><strong>Avg of 5:</strong> <span id="avg5">-</span></p>
        <p><strong>Avg of 12:</strong> <span id="avg12">-</span></p>
      </div>
    </div>
    <div class="export-btn">
      <button onclick="exportToCSV()">⬇️ Export CSV</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Scramble</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="historyTable"></tbody>
    </table>

    <div id="pagination" class="pagination"></div>

  </div>


  <h2>Other Cubes Scramble</h2>
  <div class="cube-container">
  </div>

  <h2>OTHER GAMES</h2>
  <div class="game-holder-div" id="gameHolder"></div>

</body>
<footer id="footer"></footer>

<script type="module" src="../saveEntry.js"></script>
<script src="../squaretimer.js"></script>
<script type="module" src="../home.js"></script>


</html>
