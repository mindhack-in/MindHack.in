<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindHack.in</title>
    <link rel="stylesheet" href="../../../utility/css/header.css">
    <link rel="stylesheet" href="../../../utility/css/sidenav.css">
    <link rel="stylesheet" href="../board.css">
    <link rel="stylesheet" href="../../../utility/css/test.css">
    <link rel="stylesheet" href="../../../utility/css/aboutus.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="headerMain">
        <header class="header-container">
            <div class="logo">
                <img class="logoimg" id="logoimg" src="https://mindhack-in.github.io/mindhack.in.dynamic/logo.png" />
            </div>
            <nav class="nav-links" id="navLinks">
            </nav>

            <div class="user-actions">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <button class="login-btn" id="userDetails">Login</button>
            </div>

        </header>
    </div>
    <aside class="left-sidebar" id="leftSidebar"></aside>

  <div class="headcontainer">
    <div class="container1">
      <div class="game" id="gamePage">
        <div id="puzzle"></div>
        <div class="controls">
          <span id="moves">Moves: <span id="moveCount">0</span></span>
          <button onclick="shuffleTiles()">Restart</button>
          <button onclick="goBack()">Back</button>
          <button id="openPopupBtn" >Load history</button>
        <p id="message"></p>

        </div>
      </div>
    </div>
  </div>



  <div class="history popup-overlay " id="popup">
    <div class="popup-content">
      <h3>Game History</h3>
      <button class="close-btn" id="closePopupBtn">Close</button>

      <table>
        <thead>
          <tr>
            <th>Grid Size</th>
            <th>Date</th>
            <th>Moves</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
          <div id="pagination" style="margin-top:10px; text-align:center;"></div>

    </div>
  </div>
  </div>

    <section class="about-section fade-in" id="about">
    </section>

</body>
<footer id="footer"></footer>



<script type="module" src="../../../utility/js/base.js"></script>
<script type="module" src="../../../utility/js/auth.js"></script>

<script>
  window.pageConfig = { size: "7" };
</script>

<script src="../board.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const home_nav = document.getElementById("home_nav");
        home_nav.classList.toggle("active");

        const games_nav = document.getElementById("games_nav");
        games_nav.classList.toggle("active");
    });
</script>


</html>
