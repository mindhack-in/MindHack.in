<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyraminx Cube 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }

        .container {
            perspective: 1000px;
            width: 400px;
            height: 400px;
        }

        .pyraminx {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: spin 5s infinite linear;
        }

        /* Base shape */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .face.top {
            transform: rotateX(90deg) translateZ(200px);
        }

        .face.left {
            transform: rotateY(-120deg) translateZ(200px);
        }

        .face.right {
            transform: rotateY(120deg) translateZ(200px);
        }

        .face.bottom {
            transform: rotateX(-90deg) translateZ(200px);
        }

        /* Individual pieces on the faces */
        .piece {
            width: 50%;
            height: 50%;
            background-color: gray;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            margin: 5px;
        }

        /* Colors for the pieces */
        .piece.red {
            background-color: red;
        }

        .piece.green {
            background-color: green;
        }

        .piece.blue {
            background-color: blue;
        }

        .piece.orange {
            background-color: orange;
        }

        .piece.yellow {
            background-color: yellow;
        }

        /* Spin animation */
        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pyraminx">
            <!-- Faces of the Pyraminx -->
            <div class="face top">
                <div class="piece red"></div>
                <div class="piece green"></div>
                <div class="piece blue"></div>
            </div>
            <div class="face left">
                <div class="piece orange"></div>
                <div class="piece yellow"></div>
                <div class="piece red"></div>
            </div>
            <div class="face right">
                <div class="piece green"></div>
                <div class="piece yellow"></div>
                <div class="piece blue"></div>
            </div>
            <div class="face bottom">
                <div class="piece blue"></div>
                <div class="piece red"></div>
                <div class="piece green"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const pyraminx = document.querySelector(".pyraminx");

            let isDragging = false;
            let startX, startY, currentX = 0, currentY = 0;

            pyraminx.addEventListener("mousedown", (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
            });

            document.addEventListener("mousemove", (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                currentX += dx * 0.5;  // Slow down the rotation
                currentY -= dy * 0.5;

                pyraminx.style.transform = `rotateX(${currentY}deg) rotateY(${currentX}deg)`;
                startX = e.clientX;
                startY = e.clientY;
            });

            document.addEventListener("mouseup", () => {
                isDragging = false;
            });
        });
    </script>
</body>
</html>
