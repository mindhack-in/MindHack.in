<!DOCTYPE html>
<html lang="en">

<head>
    <title>Contact Us - Free Online Brain Games & Puzzles | Mindhack.in</title>
    <link rel="canonical" href="https://mindhack.in/contact/" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Have a question, found a bug, or want to suggest a game? Get in touch with the team behind Mindhack.in's free online brain games and puzzles.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mindhack.in/contact/">
    <meta property="og:title" content="Contact Us - Free Online Brain Games & Puzzles | Mindhack.in">
    <meta property="og:description" content="Have a question, found a bug, or want to suggest a game? Get in touch with the team behind Mindhack.in's free online brain games and puzzles.">
    <meta property="og:image" content="https://mindhack-in.github.io/mindhack.in.dynamic/logo.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://mindhack.in/contact/">
    <meta name="twitter:title" content="Contact Us - Free Online Brain Games & Puzzles | Mindhack.in">
    <meta name="twitter:description" content="Have a question, found a bug, or want to suggest a game? Get in touch with the team behind Mindhack.in's free online brain games and puzzles.">
    <meta name="twitter:image" content="https://mindhack-in.github.io/mindhack.in.dynamic/logo.png">

    <link rel="stylesheet" href="../utility/css/font.css" />
    <link rel="stylesheet" href="../utility/css/template.css" />
    <link rel="stylesheet" href="../utility/css/home.css" />
    <link rel="stylesheet" href="../utility/css/games.css" />
    <link rel="stylesheet" href="../utility/css/auth.css" />

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://mindhack.in/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Contact Us",
          "item": "https://mindhack.in/contact/"
        }
      ]
    }
    </script>

    <style>
        /* Contact page styling - matches the About page's card aesthetic */
        .contact-header {
            text-align: center;
            margin: 40px 0 50px;
        }

        .contact-header h1 {
            font-size: 44px;
            font-weight: 800;
            background: linear-gradient(135deg, #22c55e, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .contact-subtitle {
            color: #94a3b8;
            font-size: 17px;
            max-width: 560px;
            margin: 0 auto;
        }

        .contact-wrapper {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto 40px;
        }

        @media (max-width: 860px) {
            .contact-wrapper {
                grid-template-columns: 1fr;
            }
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 35px;
            backdrop-filter: blur(10px);
        }

        .contact-form label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .contact-form .form-group {
            margin-bottom: 20px;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px 14px;
            color: #e2e8f0;
            font-size: 15px;
            font-family: inherit;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.5);
        }

        .contact-form textarea {
            min-height: 130px;
            resize: vertical;
        }

        .contact-submit-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #0066ff;
            color: #ffffff;
            border: none;
            cursor: pointer;
            text-decoration: none;
            padding: 12px 26px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
        }

        .contact-submit-btn:hover {
            background: #0052cc;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 102, 255, 0.5);
        }

        .contact-form-note {
            color: #64748b;
            font-size: 13px;
            margin-top: 14px;
        }

        .contact-form-status {
            margin-top: 14px;
            font-size: 14px;
            display: none;
        }

        .contact-form-status.success {
            color: #22c55e;
            display: block;
        }

        .contact-form-status.error {
            color: #f87171;
            display: block;
        }

        .contact-info-card h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #3b82f6;
            margin-top: 0;
            margin-bottom: 16px;
        }

        .contact-info-card p {
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .contact-email-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #22c55e;
            text-decoration: none;
            font-weight: 600;
            word-break: break-all;
        }

        .contact-email-link:hover {
            text-decoration: underline;
        }

        /* Honeypot field - hidden from real visitors, catches simple form-spam bots */
        .hp-field {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div class="layout">
        <div class="sidebar" id="sidebar"></div>

        <div class="page-content">
            <section id="contentSection">
                <div class="contact-header">
                    <nav class="breadcrumb-nav" aria-label="Breadcrumb">
                        <ol class="breadcrumb-list">
                            <li class="breadcrumb-item"><a href="/">Home</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Contact Us</li>
                        </ol>
                    </nav>
                    <h1>Contact Us</h1>
                    <p class="contact-subtitle">Found a bug, have a game suggestion, or just want to say hello? We'd love to hear from you.</p>
                </div>

                <div class="contact-wrapper">
                    <div class="contact-card">
                        <!--
                            FORM SETUP (do this once before going live):
                            1. Create a free account at https://formspree.io
                            2. Create a new form and set its notification email to support@mindhack.in
                            3. Formspree will give you a form ID that looks like "xySDkabc"
                            4. Replace YOUR_FORM_ID in the action attribute below with that ID
                            Until step 4 is done, this form will not actually deliver messages -
                            visitors can still reach you via the mailto link in the card on the right.
                        -->
                        <form id="contact-form" class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                            <div class="form-group">
                                <label for="contact-name">Name</label>
                                <input type="text" id="contact-name" name="name" placeholder="Your name" required>
                            </div>
                            <div class="form-group">
                                <label for="contact-email">Email</label>
                                <input type="email" id="contact-email" name="email" placeholder="you@example.com" required>
                            </div>
                            <div class="form-group">
                                <label for="contact-message">Message</label>
                                <textarea id="contact-message" name="message" placeholder="What's on your mind?" required></textarea>
                            </div>

                            <!-- Honeypot anti-spam field - leave this alone -->
                            <div class="hp-field" aria-hidden="true">
                                <label for="contact-hp">Leave this field empty</label>
                                <input type="text" id="contact-hp" name="_gotcha" tabindex="-1" autocomplete="off">
                            </div>
                            <input type="hidden" name="_subject" value="New message from Mindhack.in contact form">

                            <button type="submit" class="contact-submit-btn">
                                <i class="fas fa-paper-plane"></i> Send Message
                            </button>

                            <div id="contact-form-status" class="contact-form-status"></div>
                            <p class="contact-form-note">We read every message and try to reply within a few days.</p>
                        </form>
                    </div>

                    <div class="contact-card contact-info-card">
                        <h2><i class="fas fa-envelope"></i> Prefer Email?</h2>
                        <p>Skip the form and email us directly - we check this inbox regularly.</p>
                        <a class="contact-email-link" href="mailto:support@mindhack.in">
                            <i class="fas fa-paper-plane"></i> support@mindhack.in
                        </a>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        window.pageConfig = {
            pageType: 'contact'
        };
    </script>
    <script type="module" src="../utility/js/base.js"></script>
    <script>
        // Submit the form via fetch so we can show an inline status message
        // instead of redirecting to Formspree's default confirmation page.
        const contactForm = document.getElementById('contact-form');
        const contactStatus = document.getElementById('contact-form-status');

        if (contactForm) {
            contactForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const submitBtn = contactForm.querySelector('.contact-submit-btn');
                submitBtn.disabled = true;

                try {
                    const response = await fetch(contactForm.action, {
                        method: 'POST',
                        body: new FormData(contactForm),
                        headers: { 'Accept': 'application/json' }
                    });

                    if (response.ok) {
                        contactStatus.textContent = "Thanks - your message is on its way. We'll get back to you soon.";
                        contactStatus.className = 'contact-form-status success';
                        contactForm.reset();
                    } else {
                        contactStatus.textContent = 'Something went wrong sending that. Please try the email link instead.';
                        contactStatus.className = 'contact-form-status error';
                    }
                } catch (err) {
                    contactStatus.textContent = 'Something went wrong sending that. Please try the email link instead.';
                    contactStatus.className = 'contact-form-status error';
                } finally {
                    submitBtn.disabled = false;
                }
            });
        }
    </script>
</body>

</html>
